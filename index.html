<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>海陽ひとめぐり帖</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a hand-printed town zine — one framed "stage" (scene / map) on top, a working panel underneath; two-ink riso feel (sea teal + sun yellow) */
:root{
  --paper:#EEF1EA; --paper-2:#E1E6DB; --ink:#1C2630; --ink-soft:#56636B;
  --teal:#00808A; --yellow:#F3C33C; --signal:#D9506B; --on-accent:#FFFFFF; --on-yellow:#1C2630;
  --veil:rgba(28,38,48,.42);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","Osaka-Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121A1F; --paper-2:#1B252B; --ink:#E5EBE3; --ink-soft:#98A6A8;
  --teal:#3BB4BA; --yellow:#F0C64E; --signal:#F07D92; --on-accent:#0F171B; --on-yellow:#1C2630;
  --veil:rgba(5,10,13,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121A1F; --paper-2:#1B252B; --ink:#E5EBE3; --ink-soft:#98A6A8;
  --teal:#3BB4BA; --yellow:#F0C64E; --signal:#F07D92; --on-accent:#0F171B; --on-yellow:#1C2630;
  --veil:rgba(5,10,13,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-shadow:2px 1px 0 var(--yellow)}
.when{font-family:var(--f-dot);font-size:15px;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:3px}
.cal{display:flex;gap:2px;align-items:flex-end;flex:1 1 200px;min-width:0}
.cal i{flex:1;height:7px;max-width:14px;background:var(--paper-2);border:1px solid var(--ink-soft)}
.cal i.done{background:var(--teal);border-color:var(--teal)}
.cal i.now{background:var(--yellow);border-color:var(--ink);height:11px}
.btn{background:var(--paper);border:2px solid var(--ink);padding:5px 14px;border-radius:4px;box-shadow:3px 3px 0 var(--ink);font-weight:700;transition:transform .1s,box-shadow .1s,background .1s}
.btn:hover{background:var(--yellow);color:var(--on-yellow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--teal);color:var(--on-accent);border-color:var(--ink)}
.btn.primary:hover{background:var(--yellow);color:var(--on-yellow)}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:16/10;border:2.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#DCE2E7;user-select:none;-webkit-user-select:none;box-shadow:6px 6px 0 var(--teal)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(28,38,48,.13) .8px,transparent 1.1px);background-size:5px 5px;mix-blend-mode:multiply;z-index:3}
.bg,.bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait{position:absolute;right:5%;bottom:0;height:84%;aspect-ratio:200/260;z-index:2;transition:opacity .25s,transform .25s;pointer-events:none}
.portrait svg{width:100%;height:100%;display:block}
.portrait.off{opacity:0;transform:translateY(12px)}
.textbox{position:absolute;left:3%;right:3%;bottom:4%;min-height:31%;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:20px 22px 14px;box-shadow:5px 5px 0 var(--ink);z-index:4;cursor:pointer}
.textbox p{margin:0;font-size:17px;line-height:1.85;min-height:3.6em;max-width:62ch}
.nametag{position:absolute;top:-17px;left:14px;background:var(--teal);color:var(--on-accent);font-family:var(--f-display);font-size:15px;padding:3px 14px;border:2px solid var(--ink);border-radius:3px;letter-spacing:.04em}
.nametag.me{background:var(--yellow);color:var(--on-yellow)}
.more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--teal);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{position:absolute;inset:0;z-index:5;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.choice{width:min(540px,100%);text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:12px 18px;font-size:16px;font-weight:700;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,background .1s}
.choice:hover,.choice:focus-visible{background:var(--yellow);color:var(--on-yellow);transform:translate(-2px,-2px)}
.choice::before{content:"▸ ";color:var(--teal)}
.choice:hover::before{color:var(--on-yellow)}

/* overlays on stage (title / create) */
.ov{position:absolute;inset:0;z-index:6;display:flex}
.title-ov{justify-content:space-between;align-items:stretch;padding:5% 6%}
.title-left{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;max-width:52%}
.title-left p{margin:0;background:var(--paper);border:2px solid var(--ink);padding:10px 14px;border-radius:4px;font-size:14px;line-height:1.7}
.title-btns{display:flex;flex-wrap:wrap;gap:10px}
.vtitle{writing-mode:vertical-rl;font-family:var(--f-display);font-size:clamp(40px,8vw,74px);line-height:1.15;color:#1C2630;text-shadow:4px 3px 0 #F3C33C;letter-spacing:.06em;margin:0}
.vtitle small{display:block;font-size:.3em;letter-spacing:.2em;font-family:var(--f-body);font-weight:700;text-shadow:none;margin-left:.6em;color:#1C2630}
.create-ov{align-items:center;justify-content:center;background:var(--veil);padding:16px}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--teal);padding:20px 22px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:2px solid var(--ink);background:var(--paper);border-radius:4px;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.05em}
.field input{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;background:var(--paper-2);color:var(--ink)}

/* map pins */
.pins{position:absolute;inset:0;z-index:2}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0}
.pin .lab{background:#F7F7F2;color:#1C2630;border:2px solid #1C2630;border-radius:3px;font-size:12px;font-weight:700;padding:0 6px;white-space:nowrap;box-shadow:2px 2px 0 #1C2630}
.pin .dot{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#F3C33C;border:2.5px solid #1C2630}
.pin.new .dot{background:#E8607A}
.pin.home .dot{background:#F7F7F2}
.pin:hover .lab,.pin:focus-visible .lab{background:#F3C33C}

/* below panel */
.below{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.below h2{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 0 10px;text-wrap:balance}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .1s,box-shadow .1s;box-shadow:3px 3px 0 var(--ink)}
.card:hover,.card:focus-visible{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--teal)}
.card .pl{font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .prog{font-family:var(--f-dot);font-size:13px;color:var(--teal);letter-spacing:.1em;white-space:nowrap}
.card .who{font-size:13.5px;line-height:1.5}
.card .rumor{color:var(--ink-soft)}
.card .lock{font-size:12px;color:var(--signal);font-weight:700}
.card .badge{font-size:11px;background:var(--signal);color:var(--on-accent);padding:0 6px;border-radius:2px;margin-left:4px;font-family:var(--f-body)}
.card.home{border-style:dashed}
.skills{display:flex;flex-direction:column;gap:9px}
.sk{display:grid;grid-template-columns:28px 4.3em 1fr 1.6em;gap:8px;align-items:center}
.stamp{width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--teal);color:var(--teal);font-family:var(--f-display);font-size:15px;border-radius:3px}
.sk .nm{font-weight:700;font-size:14px}
.segbar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.segbar i{height:12px;background:var(--paper-2);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.segbar i.on{background:var(--teal);border-color:var(--teal)}
.segbar i.up{background:var(--yellow);border-color:var(--ink)}
.sk .v{font-family:var(--f-dot);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.ties{margin:12px 0 0;font-size:13.5px;border-top:2px dotted var(--ink-soft);padding-top:10px}
.ties b{font-family:var(--f-dot);font-size:17px;color:var(--teal)}
.hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--paper);border-radius:3px;padding:5px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--yellow);animation:tin .25s ease-out}
.toast b{color:var(--yellow);font-family:var(--f-dot)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* modal (帖) */
.modal{position:fixed;inset:0;z-index:40;background:var(--veil);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);border:2.5px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--teal);width:min(760px,100%);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sheet h3{margin:0 0 8px;font-size:14px;letter-spacing:.12em;color:var(--teal)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.person{border:2px solid var(--ink);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.person.unmet{border-style:dashed;color:var(--ink-soft)}
.person .pn{font-family:var(--f-display);font-size:15px}
.person .pj{font-size:12px;color:var(--ink-soft)}
.person q{display:block;font-size:13.5px;line-height:1.6;quotes:"「" "」";border-left:3px solid var(--yellow);padding-left:8px}
.skilldesc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px;font-size:13.5px}
.skilldesc div{display:flex;gap:8px;align-items:flex-start}
.foot{font-size:12px;color:var(--ink-soft);margin:0;max-width:70ch}

/* zine ending */
.zine{border:2.5px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:7px 7px 0 var(--teal);padding:28px clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.mast h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,48px);line-height:1.15;text-shadow:3px 2px 0 var(--yellow);text-wrap:balance}
.mast .issue{font-family:var(--f-dot);font-size:14px;text-align:right}
.zgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:26px;align-items:start}
.titlebadge{display:inline-block;background:var(--teal);color:var(--on-accent);font-family:var(--f-display);font-size:20px;padding:4px 14px;border:2px solid var(--ink);border-radius:3px;box-shadow:3px 3px 0 var(--ink)}
.radar{width:100%;max-width:320px;display:block;margin:6px auto 0}
.radar text{font-family:var(--f-body);font-weight:700;font-size:13px;fill:var(--ink)}
.lede{font-size:16px;line-height:1.9;margin:0;max-width:60ch}
.zpeople{display:flex;flex-direction:column;gap:14px}
.zp{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.zp .face{width:58px;height:75px}
.zp .face svg{width:100%;height:100%;display:block}
.zp .nm{font-family:var(--f-display);font-size:15px}
.zp .nm span{font-family:var(--f-body);font-size:12px;color:var(--ink-soft);margin-left:6px}
.zp q{display:block;font-size:15px;line-height:1.65;quotes:"「" "」";margin-top:2px}
.zbtns{display:flex;flex-wrap:wrap;gap:10px}

@media (max-width:720px){
  .below{grid-template-columns:1fr}
  .zgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .stage{aspect-ratio:3/4}
  .stage.is-map{aspect-ratio:16/10}
  .portrait{height:56%;right:2%}
  .textbox{min-height:40%;padding:18px 16px 14px}
  .textbox p{font-size:16px}
  .places{grid-template-columns:1fr}
  .title-ov{flex-direction:column-reverse;align-items:stretch;justify-content:space-between}
  .title-left{max-width:100%}
  .vtitle{align-self:flex-end}
  .pin .lab{font-size:10px;padding:0 4px}
  .pin .dot{width:12px;height:12px}
}
.ff{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">ひとめぐり帖</div>
    <div class="when" id="when" hidden></div>
    <div class="cal" id="cal" aria-hidden="true"></div>
    <button class="btn" id="bookBtn" hidden>帖をひらく</button>
  </header>
  <div class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="pins" id="pins" hidden></div>
    <div class="portrait off" id="portrait"></div>
    <div class="textbox" id="textbox" hidden role="button" tabindex="0" aria-label="つぎへ">
      <div class="nametag" id="nametag" hidden></div>
      <p id="text" aria-live="polite"></p>
      <span class="more" id="more" aria-hidden="true">▼</span>
    </div>
    <div class="choices" id="choices" hidden></div>
    <div class="ov" id="ov" hidden></div>
  </div>
  <section class="below" id="below" hidden>
    <div id="placesWrap">
      <h2 id="prompt"></h2>
      <div class="places" id="places"></div>
    </div>
    <aside>
      <h2>5つの力</h2>
      <div class="skills" id="skills"></div>
      <p class="ties" id="tiesLine"></p>
    </aside>
  </section>
  <section class="zine" id="zine" hidden></section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <div class="sheet-head"><h2 id="bookTitle">帖</h2><button class="btn" id="closeBook">とじる</button></div>
    <div id="bookBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- palette for illustrations (printed look, same in both themes) ---------- */
const P={sky:{spring:'#E3EDD5',summer:'#CDE6E4',autumn:'#F0DCCE',winter:'#DCE2E7'},sea:'#118892',deep:'#0B5D67',hill:'#88BAAB',mid:'#4E8274',forest:'#2E5D54',sand:'#E8D8A8',land:'#DCE6D1',wall:'#E6E9E1',wood:'#C79A5F',line:'#1C2630',paper:'#F7F7F2',yellow:'#F3C33C',pink:'#E8607A',navy:'#27395A',skin:'#F6E4D3',night:'#15222A',glow:'#F6E88E',scrub:'#9ED3CF',ground:'#C9C3AE'};

const SK={cur:{k:'好',name:'好奇心',d:'「なんで?」と思って、知ろうとする力'},per:{k:'続',name:'持続性',d:'うまくいかなくても、続ける力'},fle:{k:'柔',name:'柔軟性',d:'状況に合わせて、考えや行動を変える力'},opt:{k:'楽',name:'楽観性',d:'「なんとかなる」と前を向く力'},risk:{k:'冒',name:'冒険心',d:'結果がわからなくても、一歩ふみ出す力'}};
const SKO=['cur','per','fle','opt','risk'];

/* ---------- script helpers ---------- */
const n=t=>({n:t}), me=t=>({me:t}), ch=(...o)=>({c:o}), o=(l,fx,...r)=>({l,fx,r}), note=(who,t)=>({note:t,who}), bg=k=>({bg:k});
const sp=id=>t=>({s:id,t}); const U=sp('u'),I=sp('i'),M=sp('m'),K=sp('k'),Y=sp('y'),C=sp('c');

/* ---------- characters ---------- */
const CH={
u:{name:'浜崎 潮',short:'潮さん',job:'漁師',place:'宍喰漁港',pl:'漁港',rumor:'朝早く、漁師さんが網を手入れしているらしい',bg:'port',key:'fle',pin:[28.5,81],
 look:{hair:'short',body:P.deep,acc:'hachimaki'},
 eps:[
 {req:null,lines:[n('朝5時半の宍喰漁港。空はまだ、うすい紫色だ。'),n('日焼けしたおじさんが、だまって網をたぐっている。'),U('ん? こんな朝はように、子どもが何しよんな。'),me('漁師さんの仕事、見てみたくて。'),U('ほう、物好きやなあ。わしは浜崎潮。この港で40年、伊勢えびとっとる。'),U('海はな、毎日ちがう顔するんじょ。昨日とれた場所で、今日もとれるとはかぎらん。'),
  ch(o('「どうやって、とれる場所を決めるの?」','cur',U('風と、水の色と、あとは勘やな。勘いうても、40年分の失敗でできとる勘じょ。')),
     o('「網、ちょっとさわってもいい?」','risk',n('網はずっしり重くて、海のにおいがした。'),U('ははは、ええ手つきや。')),
     o('だまって、作業を最後まで見る','per',n('1時間。潮さんの手は、一度も止まらなかった。'),U('……最後まで見とったんか。根性あるのう。'))),
  U('また来たらええ。海は逃げんけん。'),note('u','海は毎日ちがう顔をする')]},
 {req:null,lines:[n('今日の港は静かだった。潮さんが、空っぽのかごを見つめている。'),U('今朝は、さっぱりや。水が冷たすぎた。'),me('……ざんねんだね。'),U('こういう日もある。いや、こういう日のほうが多いくらいじょ。'),
  ch(o('「明日はきっと、とれるよ!」','opt',U('……ははっ。そうやな。漁師はな、明日を信じられんとやっていけん。')),
     o('「とれないとき、どうするの?」','fle',U('網を入れる場所を変える。時間を変える。それでもあかんかったら、網の手入れや。'),U('とれん日にやることも、ちゃんとあるんじょ。')),

function fresh(){return{name:'',g:'boy',I:'ぼく',suf:'くん',t:0,st:{cur:1,per:1,fle:1,opt:1,risk:1},ties:{},notes:[],seen:{},flags:{},phase:'title'}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}

const $=id=>document.getElementById(id);

function monthOf(t){return((3+Math.floor(t/2))%12)+1}
function seasonOf(t){const m=monthOf(t);return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'}
function whenText(t){return `6年生 ${monthOf(t)}月 ${t%2?'後半':'前半'}`}
function metOthers(){return['u','i','m','k','y'].filter(id=>(S.ties[id]||0)>0).length}
function fmt(t,isChar){return t.replace(/\{N\}/g,isChar?S.name+S.suf:S.name).replace(/\{I\}/g,S.I)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function svg(inner){return `<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`}
function cedar(x,y,h,c){return `<path d="M${x} ${y-h}L${x-h*.26} ${y-h*.4}H${x-h*.14}L${x-h*.36} ${y}H${x+h*.36}L${x+h*.14} ${y-h*.4}H${x+h*.26}Z" fill="${c}"/>`}
function cedars(y,n,h,c,x0,x1,seed){let s='';for(let i=0;i<n;i++){const x=x0+(x1-x0)*(i/(Math.max(1,n-1)))+((i*37+seed)%21)-10;const hh=h*(.78+((i*53+seed)%17)/38);s+=cedar(x,y,hh,c)}return s}
function waves(y,c,op){let d=`M0 ${y}`;for(let i=0;i<10;i++)d+=` q40 -9 80 0`;return `<path d="${d}" stroke="${c}" stroke-width="3" fill="none" opacity="${op}"/>`}

let curBg='';

let curP=null;
function setPortrait(id){if(id===curP)return;curP=id;const p=$('portrait');if(!id){p.classList.add('off');return}p.innerHTML=portrait(id);p.classList.remove('off')}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2300)}
const lastUp={};
function applyFx(fx){if(!fx)return;if(typeof fx==='string')fx={[fx]:1};for(const k in fx){const before=S.st[k];S.st[k]=Math.min(10,S.st[k]+fx[k]);if(S.st[k]>before){lastUp[k]=Date.now();toast(`${SK[k].name} <b>+${S.st[k]-before}</b>`)}}renderSkills()}
function addNote(who,t){if(S.notes.some(x=>x.t===t))return;S.notes.push({who,t});toast('帖に、ことばを書きとめた')}

function renderHeader(){
 const on=S&&['map','scene'].includes(S.phase);
 $('when').hidden=!on;$('bookBtn').hidden=!S||S.phase==='title';
 if(on)$('when').textContent=whenText(S.t);
 $('cal').innerHTML=on?Array.from({length:24},(_,i)=>`<i class="${i<S.t?'done':i===S.t?'now':''}"></i>`).join(''):'';
}
function renderSkills(){
 if(!S)return;const now=Date.now();
 $('skills').innerHTML=SKO.map(k=>{const v=S.st[k];const fresh=now-(lastUp[k]||0)<2500;return `<div class="sk" title="${SK[k].d}"><span class="stamp">${SK[k].k}</span><span class="nm">${SK[k].name}</span><span class="segbar">${Array.from({length:10},(_,i)=>`<i class="${i<v?(fresh&&i===v-1?'up':'on'):''}"></i>`).join('')}</span><span class="v">${v}</span></div>`}).join('');

}
function lockText(id){const c=CH[id],n=S.ties[id]||0;if(n>=3)return '';const r=c.eps[n].req;if(!r||reqOk(r))return '';
 if(r.stat)return `次の話は「${SK[r.stat].name}」${r.v} 以上(いま ${S.st[r.stat]})`;return `次の話は、町の人 ${r.met}人と出会ってから(いま ${metOthers()}人)`}
function reqOk(r){return !r||(r.stat&&S.st[r.stat]>=r.v)||(r.met&&metOthers()>=r.met)}
function renderPlaces(){
 $('prompt').textContent=`${monthOf(S.t)}月${S.t%2?'後半':'前半'}。どこへ行こう?`;

  ${lk?`<span class="lock">${lk}</span>`:n>=3?`<span class="who rumor">また顔を見に行こう</span>`:''}</button>`}).join('');
 $('places').innerHTML=cards+`<button class="card home" data-go="home"><span class="pl">家ですごす</span><span class="who rumor">本を読む・手伝い・休む</span></button>`;
 $('pins').innerHTML=IDS.map(id=>{const c=CH[id];return `<button class="pin ${(S.ties[id]||0)?'':'new'}" data-go="${id}" style="left:${c.pin[0]}%;top:${c.pin[1]}%" aria-label="${c.place}"><span class="lab">${c.pl}</span><span class="dot"></span></button>`}).join('')+`<button class="pin home" data-go="home" style="left:46%;top:56%" aria-label="家"><span class="lab">家</span><span class="dot"></span></button>`;
}

/* ---------- scene engine ---------- */
let Q=[],qi=0,onDone=null,typer=null,full='';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(lines,done){Q=lines.slice();qi=0;onDone=done;S.phase=S.phase==='ending'?'ending':'scene';
 $('pins').hidden=true;$('ov').hidden=true;$('placesWrap').hidden=true;renderHeader();step()}
function step(){
 while(qi<Q.length){const x=Q[qi];
  if(x.bg){setBg(x.bg);setPortrait(null);qi++;continue}
  if(x.note){addNote(x.who,x.t||x.note);qi++;continue}
  if(x.flag){S.flags[x.flag]=1;qi++;continue}
  if(x.fx){applyFx(x.fx);qi++;continue}
  if(x.when){qi++;continue}
  break}
 if(qi>=Q.length){$('textbox').hidden=true;setPortrait(null);const d=onDone;onDone=null;d&&d();return}
 const x=Q[qi];
 if(x.c){showChoices(x.c);return}
 showLine(x);
}
function showLine(x){
 const tb=$('textbox'),tag=$('nametag');tb.hidden=false;
 let txt,name=null,isMe=false;
 if(x.n){txt=fmt(x.n,false)}else if(x.me){txt=fmt(x.me,false);name=S.name;isMe=true}else{txt=fmt(x.t,true);name=CH[x.s].short;setPortrait(x.s)}
 tag.hidden=!name;tag.textContent=name||'';tag.classList.toggle('me',isMe);
 full=txt;const p=$('text');clearInterval(typer);$('more').hidden=true;
 if(reduce){p.textContent=full;$('more').hidden=false;typer=null;return}
 let i=0;p.textContent='';typer=setInterval(()=>{i++;p.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typer);typer=null;$('more').hidden=false}},26);
}
function advance(){if(!$('choices').hidden)return;if(typer){clearInterval(typer);typer=null;$('text').textContent=full;$('more').hidden=false;return}qi++;step()}
function showChoices(opts){
 const box=$('choices');box.hidden=false;
 box.innerHTML=opts.map((op,i)=>`<button class="choice" data-i="${i}">${esc(fmt(op.l,false))}</button>`).join('');
 box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const op=opts[+b.dataset.i];box.hidden=true;
  const extra=[];const mq=op.l.match(/^「([^」]*)」/);if(mq)extra.push(me(mq[1]));
  Q.splice(qi+1,0,...extra,{fx:op.fx},...op.r);qi++;step()});
 box.querySelector('.choice').focus();
}
$('textbox').addEventListener('click',advance);
$('textbox').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}});
document.addEventListener('keydown',e=>{if($('modal').hidden&&!$('textbox').hidden&&$('choices').hidden&&(e.key==='Enter'||e.key===' ')&&document.activeElement===document.body){e.preventDefault();advance()}});

function startTurn(){const ev=SEASONAL[S.t];if(ev&&!S.seen[ev]){S.seen[ev]=1;save();play(EV[ev],showMap)}else showMap()}
function visit(id){
 if(id==='home'){play([bg('home'),n('今日は、家ですごすことにした。'),ch(o('図書館で、仕事の本を読む','cur',n('世の中には、聞いたことのない仕事が、何百もあった。')),o('家の手伝いをする','fle',n('晩ごはんの魚をさばくのを手伝った。思ったより、むずかしい。')),o('のんびり休む','opt',n('ひさしぶりに、ぐっすり眠れた。明日もがんばろう。')))],endAction);return}
 const c=CH[id],k=S.ties[id]||0;
 if(k>=3){const r=SKO[Math.floor(Math.random()*5)];play([bg(c.bg),...c.after,{fx:r}],endAction);return}
 const ep=c.eps[k];
 if(!reqOk(ep.req)){const r=ep.req;const hint=r.stat?`もっと「${SK[r.stat].name}」が育ったら、${c.short}のちがう話が聞けるかもしれない。`:`町の人に、あと${r.met-metOthers()}人会ってから、また来よう。`;
  play([bg(c.bg),...c.wait,n(hint),{fx:c.key}],endAction);return}
 play([bg(c.bg),...ep.lines],()=>{S.ties[id]=k+1;applyFx(c.key);toast(`${c.short}とのつながり <b>${k+1}/3</b>`);renderSkills();endAction()});
}
function endAction(){
 const m=monthOf(S.t);
 if(!SEASONAL[S.t+1]&&Math.random()<.32){const pool=Object.keys(RAND).filter(k=>!S.seen[k]&&(()=>{const w=RAND[k].find(x=>x.when);return !w||w.when.includes(m)})());
  if(pool.length){const k=pool[Math.floor(Math.random()*pool.length)];S.seen[k]=1;play([...RAND[k].slice(0,1),n('——思いがけない、できごと。'),...RAND[k].slice(1)],nextTurn);return}}
 nextTurn();
}
function nextTurn(){S.t++;if(S.t>=24){ending();return}startTurn()}

/* ---------- ending ---------- */
const TITLES={cur:'なぜなぜ探検家',per:'こつこつ職人',fle:'しなやか旅人',opt:'おひさま係',risk:'はじめの一歩名人'};
const TLINE={cur:'「なんで?」と聞くたびに、新しい扉がひらいた。',per:'うまくいかない日も、足を止めなかった。',fle:'予定どおりにいかない日を、楽しめるようになった。',opt:'「なんとかなる」と笑える日が、ふえた。',risk:'こわくても、一歩ふみ出せるようになった。'};
function topStat(){return SKO.slice().sort((a,b)=>S.st[b]-S.st[a])[0]}
function ending(){
 S.phase='ending';save();const met=IDS.filter(id=>(S.ties[id]||0)>0).length;const top=topStat();
 const L2=[bg('school'),n('3月。卒業式の日。'),n('教室のうしろの「将来の夢」の紙。1年前、{I}のは白いままだった。')];
 if(met>=4)L2.push(n('今は、書きたいことがありすぎて、紙が足りない。'));
 else if(met>=2)L2.push(n('今は、少しだけ、書けることがある。'));
 else L2.push(n('今も、まだ白いまま。でもそれは「まだ何にでもなれる」ということだ。'),n('中学生になったら、もっと会いに行こう。'));
 L2.push(n(TLINE[top]));
 if(S.flags.zine)L2.push(n('ことりさんと作った雑誌が、町じゅうに配られた。表紙には、{N}の名前。'));
 L2.push(n('将来の夢は、まだひとつに決まらない。でも、それでいい。'),n('扉は、思っていたより、たくさんあった。'));
 play(L2,showZine);
}
function radar(){
 const cx=160,cy=150,R=100;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 let g='';for(const f of[.25,.5,.75,1])g+=`<polygon points="${SKO.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" style="fill:none;stroke:var(--ink-soft)" stroke-width="1" opacity=".5"/>`;
 SKO.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--ink-soft)" stroke-width="1" opacity=".5"/>`});
 const poly=SKO.map((k,i)=>pt(i,R*S.st[k]/10).join(',')).join(' ');
 g+=`<polygon points="${poly}" style="fill:var(--teal);stroke:var(--teal)" fill-opacity=".35" stroke-width="3" stroke-linejoin="round"/>`;
 SKO.forEach((k,i)=>{const[x,y]=pt(i,R*S.st[k]/10);g+=`<circle cx="${x}" cy="${y}" r="4.5" style="fill:var(--yellow);stroke:var(--ink)" stroke-width="1.5"/>`;const[lx,ly]=pt(i,R+26);g+=`<text x="${lx}" y="${ly+4}" text-anchor="middle">${SK[k].name} ${S.st[k]}</text>`});
 return `<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="5つの力のレーダー">${g}</svg>`;
}
function showZine(){
 S.phase='ending';save();renderHeader();stage.hidden=true;$('below').hidden=true;
 const met=IDS.filter(id=>(S.ties[id]||0)>0);const all=IDS.every(id=>(S.ties[id]||0)>=3);const top=topStat();
 const title=all?'海陽町の編集長':TITLES[top];
 const people=met.map(id=>{const c=CH[id];const q=S.notes.filter(x=>x.who===id).pop();return `<div class="zp"><div class="face">${portrait(id)}</div><div><div class="nm">${c.name}さん<span>${c.job}・${c.place}</span></div>${q?`<q>${esc(q.t)}</q>`:''}</div></div>`}).join('');
 const un=IDS.filter(id=>!met.includes(id)).map(id=>CH[id].job).join('、');
 const z=$('zine');z.hidden=false;
 z.innerHTML=`<div class="mast"><h1>${esc(S.name)}の<br>ひとめぐり帖</h1><div class="issue">海陽町 はたらく人 特集号<br>6年生の1年間</div></div>
 <div class="zgrid"><div><span class="titlebadge">${title}</span>${radar()}
  <p class="lede">${esc(fmt(TLINE[top],false))}この1年で、${met.length}人の大人に出会い、${S.notes.length}個のことばを集めた。${S.flags.zine?'その言葉は、町の雑誌になった。':''}</p></div>
  <div class="zpeople">${people||'<p class="lede">まだ、だれにも会えなかった。でも、町には会いに行ける人が、たくさんいる。</p>'}${un?`<p class="foot">まだ会っていない人:${un}</p>`:''}</div></div>
 <p class="foot">このゲームの「5つの力」(好奇心・持続性・柔軟性・楽観性・冒険心)は、クランボルツの計画された偶発性理論(1999)で、偶然の出来事をキャリアの機会に変える力とされているものです。家族や学校の外の大人との「ゆるいつながり」(Granovetter, 1973)が、その偶然を運んできます。</p>
 <div class="zbtns"><button class="btn primary" id="bAgain">もう一度、1年をすごす</button><button class="btn" id="bBook">帖をひらく</button></div>`;
 $('bAgain').onclick=()=>{clearSave();S=null;$('zine').hidden=true;stage.hidden=false;showTitle()};$('bBook').onclick=openBook;
 window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- book ---------- */
function openBook(){
 if(!S)return;const body=$('bookBody');
 const people=IDS.map(id=>{const c=CH[id],k=S.ties[id]||0;const qs=S.notes.filter(x=>x.who===id);
  return k?`<div class="person"><div class="pn">${c.name}さん</div><div class="pj">${c.job}・${c.place}・${'●'.repeat(k)}${'○'.repeat(3-k)}</div>${qs.map(x=>`<q>${esc(x.t)}</q>`).join('')}</div>`
   :`<div class="person unmet"><div class="pn">???</div><div class="pj">${c.place}</div><div>${c.rumor}</div></div>`}).join('');
 body.innerHTML=`<h3>出会った人と、ことば</h3><div class="people">${people}</div>
 <h3 style="margin-top:18px">5つの力</h3><div class="skilldesc">${SKO.map(k=>`<div><span class="stamp">${SK[k].k}</span><span><b>${SK[k].name} ${S.st[k]}</b><br>${SK[k].d}</span></div>`).join('')}</div>
 <p class="foot" style="margin-top:14px">5つの力は、クランボルツの計画された偶発性理論(Planned Happenstance Theory)にもとづいています。</p>`;
 $('bookTitle').textContent=`${S.name}の帖`;$('modal').hidden=false;$('closeBook').focus();
}
function closeBook(){$('modal').hidden=true}
$('bookBtn').onclick=openBook;$('closeBook').onclick=closeBook;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeBook()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeBook()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&S&&S.phase==='map'){visit(b.dataset.go)}});

/* ---------- boot (keeps progress across live updates) ---------- */
window.claude?.hot?.snapshot?.(()=>({S}));
function boot(data){
 const d=data&&data.S?data.S:null;
 if(d&&d.name&&(d.phase==='map'||d.phase==='scene')){S=d;$('below').hidden=false;showMap();return}
 if(d&&d.phase==='ending'){S=d;showZine();return}
 S=null;showTitle();
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
